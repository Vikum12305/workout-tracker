<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<style>
:root{--bg:#07080a;--bg2:#0d0f12;--card:#12151a;--line:#1f242c;--tx:#eef1f5;--mu:#7d8794;--ac:#2f64d6;--ac2:#244fae;--acb:rgba(47,100,214,.16);--am:#f5b342;--bl:#5aa9ff;--r:16px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f8;--bg2:#fff;--card:#fff;--line:#e3e7ee;--tx:#10141a;--mu:#6b7684;--ac:#2557c4;--ac2:#1d479f;--acb:rgba(37,87,196,.10);color-scheme:light}}
:root[data-theme="dark"]{--bg:#07080a;--bg2:#0d0f12;--card:#12151a;--line:#1f242c;--tx:#eef1f5;--mu:#7d8794;--ac:#2f64d6;--ac2:#244fae;--acb:rgba(47,100,214,.16);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:600px;margin:0 auto;padding:22px 16px 56px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
.date-l{color:var(--mu);font-size:13px;margin-top:2px}
.sync{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px;padding-bottom:3px}
.sync:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mu)}
.sync.ok:before{background:#1e9e6a}
.ghost{display:block;margin:12px auto 0;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;font-weight:600;padding:8px 12px;cursor:pointer}
.ghost[data-arm]{color:#e0716e}
.sync:empty{display:none}
[hidden]{display:none!important}
.rbtn{padding:12px 16px;border-radius:12px;border:1px solid #c0504d;background:transparent;color:#e0716e;font:inherit;font-weight:700;cursor:pointer}
.rbtn.solid{background:#b83f3c;border-color:#b83f3c;color:#fff}
.cbtn{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.rq{font-weight:600;margin-bottom:10px}.rrow{display:flex;gap:10px}
.hint{color:var(--mu);font-size:12px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 12px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.stat b small{font-size:14px;color:var(--mu);font-weight:600;letter-spacing:0}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:6px;transition:width .35s}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
input[type=date]{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{background:none;color:var(--mu);border:0;border-radius:8px;padding:8px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.focus{color:var(--mu);font-size:13px;margin:10px 0 4px}
.prog{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.prog .bar{flex:1}.prog span{font-size:13px;font-weight:700;min-width:62px;text-align:right}
.ex{border-top:1px solid var(--line);padding:16px 0 14px}
.ex:first-child{border-top:0}
.eh{display:flex;gap:12px;align-items:flex-start}
.idx{width:28px;height:28px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mu);flex:none}
.ex.done .idx{background:#e5a823;border-color:#e5a823;color:#2a1d00;font-weight:800}
.idx.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.cf{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:50}
.cf i{position:absolute;width:7px;height:11px;border-radius:2px;animation:fly .95s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.idx.pop{animation:none}.cf{display:none}}
.win{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(229,168,35,.22),rgba(0,0,0,.9) 65%);animation:winin .25s ease-out,winout .6s ease-in 3.6s forwards;cursor:pointer}
.win canvas{position:absolute;inset:0;width:100%;height:100%}
.wb{position:relative;text-align:center;padding:0 16px;animation:slam .7s cubic-bezier(.2,1.4,.3,1)}
.wk{letter-spacing:4px;font-size:12px;font-weight:700;color:#e5a823}
.wt{font-size:clamp(42px,13vw,72px);font-weight:900;line-height:1;letter-spacing:-1px;margin:12px 0;color:#fff;text-shadow:0 0 44px rgba(229,168,35,.55)}
.ws{color:#cfd6df;font-size:15px}
@keyframes winin{from{opacity:0}to{opacity:1}}
@keyframes winout{to{opacity:0}}
@keyframes slam{0%{transform:scale(2.3);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
.nm{font-weight:650;font-size:15.5px}
.rp{color:var(--mu);font-size:12.5px;margin-top:1px}
.ctl{display:flex;align-items:center;gap:8px;margin:12px 0 0 40px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--mu);font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.set.on{border-color:#1e9e6a;color:var(--tx)}
.set.on.s0{background:color-mix(in srgb,#1e9e6a 28%,transparent)}
.set.on.s1{background:color-mix(in srgb,#1e9e6a 52%,transparent)}
.set.on.s2{background:color-mix(in srgb,#1e9e6a 76%,transparent);color:#fff}
.set.on.s3{background:#1e9e6a;color:#fff}
.kgw{position:relative;margin-left:auto}
.kg{width:88px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 28px 12px 10px;font:inherit;font-weight:700;text-align:right}
.kgw:after{content:"kg";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:12px;pointer-events:none}
.kg:focus,input[type=date]:focus{outline:2px solid var(--ac);outline-offset:0}
.last{margin:8px 0 0 40px;color:var(--mu);font-size:12px}
.btn{width:100%;margin-top:10px;padding:15px;border-radius:13px;border:0;background:var(--ac);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.off{background:transparent;color:var(--mu);border:1px solid var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh b{font-size:16px;font-weight:700}
.nav{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:36px;height:36px;font-size:17px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--mu)}
.cal .h{aspect-ratio:auto;font-size:11px;font-weight:700;letter-spacing:.6px}
.cal .d{cursor:pointer;background:var(--bg2);border:1px solid var(--line)}
.cal .done{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.cal .part{background:rgba(245,179,66,.18);border-color:var(--am);color:var(--am);font-weight:700}
.cal .sel{box-shadow:0 0 0 2px var(--bl)}
.leg{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--mu)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style></head><body><main>
<header><div><h1>Workout Tracker</h1><div class="date-l" id="dl"></div></div><div class="sync" id="sync"></div></header>

<div class="card"><div class="lbl">This week</div>
<div class="stats" style="margin-top:12px">
<div class="stat"><div class="lbl">Sessions</div><b><span id="sWeek">0</span><small> / 3</small></b></div>
<div class="stat"><div class="lbl">Week streak</div><b id="sStreak">0</b></div>
<div class="stat"><div class="lbl">Total</div><b id="sTotal">0</b></div></div>
<div class="bar" style="margin-top:14px"><i id="wbar"></i></div></div>

<div class="card">
<div class="top"><input type="date" id="date" aria-label="Workout date"><div class="seg"><button data-t="A">Workout A</button><button data-t="B">Workout B</button></div></div>
<div class="focus" id="focus"></div>
<div class="prog"><div class="bar"><i id="pbar"></i></div><span id="ptxt"></span></div>
<div id="list"></div>
<button class="btn" id="fin"></button>
<button class="ghost" id="clr">Reset this day</button>
</div>

<div class="card">
<div class="mh"><button class="nav" id="prev" aria-label="Previous month">‹</button><b id="mlabel"></b><button class="nav" id="next" aria-label="Next month">›</button></div>
<div class="cal" id="cal"></div>
<div class="leg"><span><i style="background:var(--ac)"></i>Completed</span><span><i style="background:var(--am)"></i>In progress</span></div>
</div>
<div class="card"><div class="lbl">Data</div>
<div id="rs1" style="margin-top:12px"><button class="rbtn" id="rst">Reset all data</button><div class="hint">Deletes every workout, tick and weight on all your devices.</div></div>
<div id="rs2" hidden style="margin-top:12px"><div class="rq">Delete everything? This can’t be undone.</div><div class="rrow"><button class="rbtn solid" id="rsy">Yes, delete all</button><button class="cbtn" id="rsn">Cancel</button></div></div></div>
</main>
<script>
const SETS=4;
const PLAN={
A:{f:"Chest · Back · Legs · Arms · Abs",x:[["Leg Press","10–12 reps"],["Chest Press Machine","8–12 reps"],["Lat Pulldown","8–12 reps"],["Seated Leg Curl","10–12 reps"],["Standing Calf Raise","12–15 reps"],["Dumbbell Biceps Curl","10–12 reps"],["Triceps Rope Pushdown","10–12 reps"],["Dead Bug","8 reps / side"]]},
B:{f:"Legs · Chest · Back · Shoulders · Arms · Abs",x:[["Goblet Squat","8–10 reps"],["Incline Chest Press Machine","8–12 reps"],["Seated Cable Row","8–12 reps"],["Shoulder Press Machine","8–10 reps"],["Glute Bridge","10–12 reps"],["Dumbbell Lateral Raise","12–15 reps"],["Dumbbell Biceps Curl","10–12 reps"],["Triceps Rope Pushdown","10–12 reps"],["Plank","15–30 sec"]]}};
const KEY="workout_tracker_v1";
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}
let remoteDoc=null,remoteReady=false,pushT=null,resetAt=0;
try{resetAt=+(localStorage.getItem(KEY+"_r")||0)}catch(e){}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
function setSync(s,ok){const el=document.getElementById("sync");if(el){el.textContent=s;el.className="sync"+(ok?" ok":"")}}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function save(){if(data[cur])data[cur].u=Date.now();cache();schedulePush()}
function schedulePush(){if(!remoteDoc||!remoteReady)return;setSync("Saving…");clearTimeout(pushT);
  pushT=setTimeout(async()=>{try{await remoteDoc.set({days:JSON.parse(JSON.stringify(data)),r:resetAt});setSync("Synced to your account",true)}catch(e){setSync("Sync failed · saved on this device")}},500)}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
let cur=today(),view=new Date();view.setDate(1);
const defType=ds=>new Date(ds+"T00:00").getDay()===3?"B":"A";
const entry=ds=>data[ds]||null;
function ensure(ds){if(!data[ds])data[ds]={t:defType(ds),s:{},k:{},done:false};return data[ds]}
const sets=(e,n)=>{const a=(e&&e.s[n])||[];return Array.from({length:SETS},(_,i)=>!!a[i])};
const partial=e=>e&&Object.values(e.s).some(a=>a.some(Boolean));
function render(){
  $("date").value=cur;
  $("dl").textContent=new Date(cur+"T00:00").toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"});
  const e=entry(cur),t=e?e.t:defType(cur),P=PLAN[t];
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("focus").textContent=P.f+" · "+SETS+" sets each";
  const last=n=>{const d=Object.keys(data).filter(x=>x<cur&&data[x].k&&data[x].k[n]).sort().pop();return d?data[d].k[n]:null};
  let tot=0,dn=0;
  $("list").innerHTML=P.x.map(([n,r],i)=>{
    const s=sets(e,n),ok=s.every(Boolean),l=last(n);tot+=SETS;dn+=s.filter(Boolean).length;
    return `<div class="ex ${ok?"done":""}"><div class="eh"><div class="idx">${ok?"✓":i+1}</div><div><div class="nm">${n}</div><div class="rp">${SETS} sets · ${r}</div></div></div>
    <div class="ctl">${s.map((v,j)=>`<button class="set s${j} ${v?"on":""}" data-n="${i}" data-j="${j}" aria-label="Set ${j+1}">${j+1}</button>`).join("")}
    <div class="kgw"><input class="kg" type="number" inputmode="decimal" placeholder="0" value="${(e&&e.k[n])||""}" data-n="${i}" aria-label="Weight in kg"></div></div>
    ${l?`<div class="last">Last session: ${l} kg</div>`:""}</div>`}).join("");
  $("pbar").style.width=(dn/tot*100)+"%";$("ptxt").textContent=dn+" / "+tot+" sets";
  const f=$("fin"),d=!!(e&&e.done);f.textContent=d?"Completed · tap to undo":"Mark workout complete";f.classList.toggle("off",d);
  stats();cal();
}
function stats(){
  const done=Object.keys(data).filter(d=>data[d].done);$("sTotal").textContent=done.length;
  const mon=d=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
  const wk={};done.forEach(d=>{const m=mon(d);wk[m]=(wk[m]||0)+1});
  const tm=mon(today()),n=wk[tm]||0;$("sWeek").textContent=n;$("wbar").style.width=Math.min(100,n/3*100)+"%";
  let s=0,m=new Date(tm+"T00:00");if((wk[tm]||0)<3)m.setDate(m.getDate()-7);
  while((wk[iso(m)]||0)>=3){s++;m.setDate(m.getDate()-7)}$("sStreak").textContent=s;
}
function cal(){
  const y=view.getFullYear(),m=view.getMonth();
  $("mlabel").textContent=view.toLocaleDateString("en",{month:"long",year:"numeric"});
  const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  let h=["M","T","W","T","F","S","S"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(first);
  for(let d=1;d<=days;d++){const ds=y+"-"+pad(m+1)+"-"+pad(d),e=entry(ds);
    h+=`<div class="d ${e&&e.done?"done":partial(e)?"part":""} ${ds===cur?"sel":""}" data-d="${ds}">${d}</div>`}
  $("cal").innerHTML=h;
}
$("list").addEventListener("click",ev=>{const b=ev.target.closest(".set");if(!b)return;
  const e=ensure(cur),n=PLAN[e.t].x[b.dataset.n][0],a=sets(e,n);const was=a.every(Boolean);a[b.dataset.j]=!a[b.dataset.j];e.s[n]=a;save();render();if(!was&&a.every(Boolean))celebrate(+b.dataset.n)});
$("list").addEventListener("change",ev=>{const i=ev.target.closest(".kg");if(!i)return;
  const e=ensure(cur);e.k[PLAN[e.t].x[i.dataset.n][0]]=i.value;save();render()});
document.querySelector(".seg").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
  const e=ensure(cur);if(e.t!==b.dataset.t){e.t=b.dataset.t;e.s={};e.k={};e.done=false}save();render()});
$("fin").onclick=()=>{const e=ensure(cur);e.done=!e.done;save();render();if(e.done)bigCelebrate()};
$("date").onchange=ev=>{if(ev.target.value){cur=ev.target.value;view=new Date(cur+"T00:00");view.setDate(1);render()}};
$("cal").addEventListener("click",ev=>{const d=ev.target.closest(".d");if(d){cur=d.dataset.d;render();window.scrollTo({top:0,behavior:"smooth"})}});
function bigCelebrate(){
  const e=entry(cur);let n=0;PLAN[e.t].x.forEach(([x])=>n+=sets(e,x).filter(Boolean).length);
  const total=Object.values(data).filter(d=>d.done).length;
  try{navigator.vibrate&&navigator.vibrate([60,40,60,40,180])}catch(_){}
  const ov=document.createElement("div");ov.className="win";
  ov.innerHTML=`<canvas></canvas><div class="wb"><div class="wk">SESSION ${total}</div><div class="wt">WORKOUT<br>COMPLETE</div><div class="ws">${n} sets logged · Workout ${e.t}</div></div>`;
  document.body.appendChild(ov);
  ov.onclick=()=>{ov.dead=true;ov.remove()};
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ov.querySelector("canvas").remove();setTimeout(()=>ov.remove(),2400);return}
  const cv=ov.querySelector("canvas"),ctx=cv.getContext("2d"),dp=window.devicePixelRatio||1,W=cv.width=innerWidth*dp,H=cv.height=innerHeight*dp;
  const cols=["#e5a823","#f2d06b","#ffffff","#1e9e6a","#2f64d6","#ef6a6a"],ps=[];
  const burst=(x,y,ang,k)=>{for(let i=0;i<k;i++){const a=ang+(Math.random()-.5)*1.2,s=(10+Math.random()*14)*dp;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:(6+Math.random()*7)*dp,h:(10+Math.random()*9)*dp,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:0})}};
  burst(0,H*.85,-Math.PI/3,100);burst(W,H*.85,-Math.PI*2/3,100);
  setTimeout(()=>{burst(W*.15,H,-Math.PI/2.2,70);burst(W*.85,H,-Math.PI/1.8,70)},350);
  setTimeout(()=>burst(W/2,H*.95,-Math.PI/2,90),700);
  const t0=performance.now();
  const step=t=>{ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.36*dp;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-p.l/190);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(t-t0<4200&&!ov.dead)requestAnimationFrame(step);else ov.remove()};
  requestAnimationFrame(step);
}
function celebrate(i){
  const el=document.querySelectorAll(".ex")[i];if(!el)return;const idx=el.querySelector(".idx");idx.classList.add("pop");
  try{navigator.vibrate&&navigator.vibrate([25,40,25])}catch(e){}
  const r=idx.getBoundingClientRect(),c=document.createElement("div");c.className="cf";c.style.left=(r.left+r.width/2)+"px";c.style.top=(r.top+r.height/2)+"px";
  const cols=["#e5a823","#f2d06b","#1e9e6a","#2f64d6","#ef6a6a","#ffffff"];
  for(let k=0;k<22;k++){const p=document.createElement("i"),an=Math.random()*Math.PI*2,d=40+Math.random()*80;
    p.style.background=cols[k%cols.length];p.style.setProperty("--dx",Math.cos(an)*d+"px");p.style.setProperty("--dy",(Math.sin(an)*d-20)+"px");p.style.setProperty("--r",(Math.random()*720-360)+"deg");c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),1000);
}
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);cal()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);cal()};
let clrT=null;
$("clr").onclick=()=>{
  const b=$("clr");
  if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Tap again to confirm";clrT=setTimeout(()=>{delete b.dataset.arm;b.textContent="Reset this day"},3000);return}
  clearTimeout(clrT);delete b.dataset.arm;b.textContent="Reset this day";
  data[cur]={t:defType(cur),s:{},k:{},done:false};save();render();
};
$("rst").onclick=()=>{$("rs1").hidden=true;$("rs2").hidden=false};
$("rsn").onclick=()=>{$("rs2").hidden=true;$("rs1").hidden=false};
$("rsy").onclick=async()=>{
  clearTimeout(pushT);resetAt=Date.now();try{localStorage.setItem(KEY+"_r",resetAt)}catch(e){}
  data={};cache();cur=today();view=new Date();view.setDate(1);render();$("rs2").hidden=true;$("rs1").hidden=false;
  if(remoteDoc){try{await remoteDoc.set({days:{},r:resetAt});setSync("Synced to your account",true)}catch(e){setSync("Sync failed · saved on this device")}}
};
async function initSync(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){setSync("Saved on this device");return}
    remoteDoc=db.doc("data/users/"+id+"/tracker");setSync("Connecting…");
    remoteDoc.onSnapshot(snap=>{
      const sd=snap.exists?(snap.data()||{}):{},rr=sd.r||0,remote={},merged={};let changed=false;
      if(rr>resetAt){resetAt=rr;try{localStorage.setItem(KEY+"_r",rr)}catch(e){}}
      Object.entries(sd.days||{}).forEach(([d,v])=>{if(!resetAt||(v.u||0)>resetAt)remote[d]=v});
      Object.keys(data).forEach(d=>{if(resetAt&&(data[d].u||0)<=resetAt){delete data[d];changed=true}});
      new Set([...Object.keys(remote),...Object.keys(data)]).forEach(d=>{const a=remote[d],b=data[d];merged[d]=!a?b:!b?a:((b.u||0)>(a.u||0)?b:a)});
      if(changed||canon(merged)!==canon(data)){data=JSON.parse(JSON.stringify(merged));cache();render()}
      remoteReady=true;
      if(canon(merged)!==canon(remote)||rr<resetAt)schedulePush();else setSync("Synced to your account",true);
    },()=>setSync("Saved on this device"));
  }catch(e){setSync("Saved on this device")}
}
render();initSync();
</script></body></html>
